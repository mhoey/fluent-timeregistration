<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        Timeregistration (V2)
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;800&display=swap" rel="stylesheet">
    <script type="module" src="./main.js"></script>
    <style>
        :root {
            --bg-color: #F8F7FF;
            /* A very light, clean purple-white */
            --card-bg: #FFFFFF;
            --primary-purple: #928BFF;
            /* Primary purple color for accents */
            --shadow: 0 0 20px rgba(100, 100, 100, 0.15);
            /* Valid centered box-shadow */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --text-dark: #333;
            --border-radius: 12px;
            --padding-md: 20px;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            /* Correct light purple-tint background */
            color: var(--text-dark);
            padding:32px;
        }

        h2 {
            margin: 0px;
        }

        .inputsection {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            /* The centered, floating shadow */
            padding: var(--padding-md);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 8px;
            max-width: 248px;
        }

        /* Form styling */
        .input-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-form label {
            font-weight: 600;
            font-size: 0.9em;
        }

        .input-form input[type="text"],
        .input-form select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1em;
            box-sizing: border-box;
            /* Crucial for width: 100% */
        }

        .input-form .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-form button.add-activity-btn {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            width: fit-content;
            transition: background-color 0.2s;
        }

        .input-form button.add-activity-btn:hover {
            background-color: #7A72E0;
            /* Darker purple on hover */
        }

        #ae {
            width: 200px;
            border: none;
            padding: 8px;
        }

        #ae {
            margin-top: 8px
        }

        #alta {
            border-collapse: collapse;
        }

        #alta th {
            width: 20%;
            color: gray;
            background-color: lightgray
        }

        #alta td,
        #alta th {
            padding: 8px;
            border: solid 1px lightgray
        }

        #th,
        #ts,
        #tm {
            color: rgb(53, 46, 80);
        }

        #th {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: bolder;
            font-size: 100px;
            letter-spacing: -0.1em;
        }

        #tm,
        #ts {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: bolder;
            font-size: 50px;
            letter-spacing: -0.1em;
        }

        #weekday-sections {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 32px;
        }

        .daycard {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            /* The centered, floating shadow */
            padding: var(--padding-md);
            margin-bottom: 20px;
            padding: 16px;
            border-radius: 4px;
            border-radius: 4px;
            width: 144px;
            height: 221px;
        }
        
        #topsection {
            display: flex;
            gap:32px;
        }

        .weekday {
            font-size: 24px;
            font-weight: bold;
        }

        .activitytable {
            width: 100%;
        }

        .weektotalduration {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <section id="topsection">
        <section id="ds" class="inputsection">
            <div class="input-form">
                <label for="ewd">Weekday</label>
                <select id="ewd">
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                </select>
                <!-- <fluent-text-input id="emt" data-format="hhmm" placeholder="00:00">Start time</fluent-text-input>
        <fluent-text-input id="elt" data-format="hhmm" placeholder="00:00">End time</fluent-text-input> -->
                <label for="emt">Start time</label>
                <input type="text" id="emt" data-format="hhmm" placeholder="00:00" />
                <label for="elt">End time</label>
                <input type="text" id="elt" data-format="hhmm" placeholder="00:00" />
                <section class="checkbox-group">
                    <input type="checkbox" id="exlt" checked>
                    <label for="exlt">Exclude lunch</label>
                </section>

                <button id="aact" class="add-activity-btn">Add activity</button>
            </div>
        </section>
        <section id="week-total" class="inputsection">

        </section>
    </section>

    <section id="weekday-sections">
        <!-- Weekday sections will be dynamically generated here -->
    </section>


    <template id="weekday-template">
        <section class="daycard">
            <h2 class="weekday"></h2>
            <table class="activitytable">
                <thead>
                    <tr>
                        <th>Start</th>
                        <th>End</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody></tbody>
                <tfoot>
                    <tr>
                        <td>Total</td>
                        <td></td>
                        <td class="daytotalduration"></td>
                    </tr>
            </table>
        </section>
    </template>

    <template id="weekday-template-no-entry">
        <section class="daycard">
            <h2 class="weekday"></h2>
            <div>No entries</div>
        </section>
    </template>

    <template id="weektotal-template">
        <h2 class="weektotal">Weekly Total</h2>
        <table class="weektotaltable">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Hours</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            <tfoot>
            </tfoot>
        </table>
    </template>
</body>

</html>
